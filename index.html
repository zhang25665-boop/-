<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#11151a" />
  <title>DEAD ZONE: LAST SURVIVOR — Phase 1</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="brand">DEAD ZONE <span> / LAST SURVIVOR</span></div>
      <div class="status">PHASE 1 · EXPLORATION</div>
      <div id="hint">左のパッド：移動　／　右側をドラッグ：視点移動</div>
    </div>

    <div id="crosshair">+</div>

    <div id="joystick" aria-label="移動スティック">
      <div id="stick"></div>
    </div>

    <div id="actions">
      <button id="jump" class="action">JUMP</button>
      <button id="run" class="action">RUN</button>
    </div>

    <div id="start-screen">
      <div class="panel">
        <div class="eyebrow">A WORLD LEFT BEHIND</div>
        <h1>DEAD ZONE</h1>
        <p>LAST SURVIVOR</p>
        <div class="rule"></div>
        <p class="description">文明が崩壊した街を探索しよう。<br>この試作版は探索と移動を体験するPhase 1です。</p>
        <button id="start">探索を開始</button>
        <small>横画面推奨 · インターネット接続が必要</small>
      </div>
    </div>
    <div id="toast"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
